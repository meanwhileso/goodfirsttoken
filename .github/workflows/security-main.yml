name: Security on main

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-main
  cancel-in-progress: false

# Runs Semgrep, CodeQL, zizmor, and OSV-Scanner on main and files every
# finding in code scanning, where only people with write access can see it.
# A push run gives pull requests a fresh analysis of their base to compare
# with, and closes alerts once a fix merges. The Monday run catches new
# advisories and new rules for code that hasn't changed.
#
# Code scanning matches each finding to the alert it already has, so a problem
# is filed once however often this runs. Each upload has a fixed category, the
# same one security.yml uses, so renaming this file files nothing again. The
# logs carry no findings. A job fails when a scan or an upload breaks, and
# findings leave it green.
#
# This is the only workflow that can write, and only security-events, which
# uploading to code scanning needs.
jobs:
  semgrep:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # to upload SARIF to code scanning
    env:
      # semgrep/semgrep:1.178.0
      SEMGREP_IMAGE: semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan with Semgrep
        run: |
          docker run --rm --volume "$PWD:/src" --volume "$RUNNER_TEMP:/out" --workdir /src "$SEMGREP_IMAGE" \
            semgrep scan --config p/typescript --config p/react --config p/github-actions \
            --metrics=off --quiet --sarif --output /out/semgrep.sarif
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/semgrep.sarif
          category: semgrep

  codeql:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # to upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          # Without it the category holds the workflow path and job, so pull
          # request analyses would never match the ones from main.
          category: /language:javascript-typescript

  zizmor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # to upload SARIF to code scanning
    env:
      ZIZMOR_VERSION: 1.30.1
      # The SHA-256 that PyPI publishes for this wheel.
      ZIZMOR_WHEEL_SHA256: eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          wheel="zizmor-${ZIZMOR_VERSION}-py3-none-manylinux_2_28_x86_64.whl"
          curl -fsSLO "https://files.pythonhosted.org/packages/py3/z/zizmor/$wheel"
          echo "$ZIZMOR_WHEEL_SHA256  $wheel" | sha256sum -c -
          unzip -q -j "$wheel" "zizmor-${ZIZMOR_VERSION}.data/scripts/zizmor" -d "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/zizmor"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan workflows and actions
        env:
          # For zizmor's checks that call the GitHub API, such as known
          # vulnerable actions.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --quiet --format sarif . > "$RUNNER_TEMP/zizmor.sarif"
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/zizmor.sarif
          category: zizmor

  osv-scanner:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # to upload SARIF to code scanning
    env:
      OSV_SCANNER_VERSION: 2.6.0
      # From the release's osv-scanner_SHA256SUMS, kept here so the binary
      # and its checksum come from different places.
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OSV-Scanner
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  osv-scanner_linux_amd64" | sha256sum -c -
          install -m 755 osv-scanner_linux_amd64 "$RUNNER_TEMP/bin/osv-scanner"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan the lockfile
        run: |
          # Exit code 1 means advisories were found. Any other failure stops
          # the job.
          osv-scanner scan source --lockfile pnpm-lock.yaml \
            --format sarif --output-file "$RUNNER_TEMP/osv-scanner.sarif" || [ $? -eq 1 ]
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/osv-scanner.sarif
          category: osv-scanner
