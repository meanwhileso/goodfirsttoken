name: Deploy an environment

# Called by deploy.yml, once for staging and once for production. The job
# runs in the GitHub environment it deploys and takes every deployment value
# from there. docs/self-hosting.md lists them.
on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment to deploy, staging or production.
        required: true
        type: string

    # Optional here because the deploy job reads its environment secrets.
    secrets:
      ADMIN_GITHUB_IDS:
        required: false
      AUTH_SECRET:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_CREDENTIAL_BROKER_URL:
        required: false
      DB_ID:
        required: false
      GH_API_URL:
        required: false
      GH_SERVICE_TOKEN:
        required: false
      GH_WEB_URL:
        required: false
      MCP_LIMITER_NAMESPACE_ID:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      OAUTH_CLIENT_SECRET:
        required: false
      OAUTH_KV_ID:
        required: false
      PRIMARY_DOMAIN:
        required: false
      REDIRECT_DOMAINS:
        required: false
      SIGN_IN_LIMITER_NAMESPACE_ID:
        required: false
      STATIC_ORIGIN:
        required: false
      STREAM_LIMITER_NAMESPACE_ID:
        required: false
      TOKEN_LIMITER_NAMESPACE_ID:
        required: false
      WORKER_NAME:
        required: false

permissions: {}

env:
  # Keep Wrangler from sending usage data from CI.
  WRANGLER_SEND_METRICS: 'false'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # for the credential broker, which trades the job's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      # No install scripts run. esbuild and workerd work without theirs, and
      # the deploy needs no generated types or git hooks.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Each setting is read as a secret or a variable. docs/self-hosting.md
      # says which to use.
      - name: Write the Wrangler config
        env:
          TARGET: ${{ inputs.environment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ secrets.WORKER_NAME || vars.WORKER_NAME }}
          DB_ID: ${{ secrets.DB_ID || vars.DB_ID }}
          OAUTH_KV_ID: ${{ secrets.OAUTH_KV_ID || vars.OAUTH_KV_ID }}
          SIGN_IN_LIMITER_NAMESPACE_ID: ${{ secrets.SIGN_IN_LIMITER_NAMESPACE_ID || vars.SIGN_IN_LIMITER_NAMESPACE_ID }}
          MCP_LIMITER_NAMESPACE_ID: ${{ secrets.MCP_LIMITER_NAMESPACE_ID || vars.MCP_LIMITER_NAMESPACE_ID }}
          TOKEN_LIMITER_NAMESPACE_ID: ${{ secrets.TOKEN_LIMITER_NAMESPACE_ID || vars.TOKEN_LIMITER_NAMESPACE_ID }}
          STREAM_LIMITER_NAMESPACE_ID: ${{ secrets.STREAM_LIMITER_NAMESPACE_ID || vars.STREAM_LIMITER_NAMESPACE_ID }}
          PRIMARY_DOMAIN: ${{ secrets.PRIMARY_DOMAIN || vars.PRIMARY_DOMAIN }}
          REDIRECT_DOMAINS: ${{ secrets.REDIRECT_DOMAINS || vars.REDIRECT_DOMAINS }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID || vars.OAUTH_CLIENT_ID }}
          ADMIN_GITHUB_IDS: ${{ secrets.ADMIN_GITHUB_IDS || vars.ADMIN_GITHUB_IDS }}
          GH_API_URL: ${{ secrets.GH_API_URL || vars.GH_API_URL }}
          GH_WEB_URL: ${{ secrets.GH_WEB_URL || vars.GH_WEB_URL }}
          STATIC_ORIGIN: ${{ secrets.STATIC_ORIGIN || vars.STATIC_ORIGIN }}
        run: node scripts/deploy-config.mjs "$TARGET"

      # The build runs before the credential step, so the Cloudflare token is
      # not in its environment. With STATIC_ORIGIN set, every built file's URL
      # is on the static host.
      - name: Build the Worker
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.deploy.json
          STATIC_ORIGIN: ${{ secrets.STATIC_ORIGIN || vars.STATIC_ORIGIN }}
        run: pnpm --filter @goodfirsttoken/web build

      - name: Get the Cloudflare credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_CREDENTIAL_BROKER_URL: ${{ secrets.CLOUDFLARE_CREDENTIAL_BROKER_URL || vars.CLOUDFLARE_CREDENTIAL_BROKER_URL }}
        run: node scripts/deploy.mjs credential

      # Right after the credential, before any step that changes the
      # environment. So the Worker's pages never link to a file the static
      # host doesn't have yet, and a static host that fails its check stops
      # the deploy with the database, the secrets, and the Worker untouched.
      # With STATIC_ORIGIN empty, it does nothing.
      - name: Upload the built files to the static host, and check it
        env:
          STATIC_ORIGIN: ${{ secrets.STATIC_ORIGIN || vars.STATIC_ORIGIN }}
        run: node scripts/deploy.mjs static-assets

      - name: Create the D1 database and queues when missing
        run: node scripts/deploy.mjs resources

      - name: Apply D1 migrations
        run: node scripts/deploy.mjs migrations

      # Each secret in secrets.required in apps/web/wrangler.jsonc gets a line
      # in this step's env, from the environment secret of the same name.
      - name: Put the Worker's secrets
        env:
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GH_SERVICE_TOKEN: ${{ secrets.GH_SERVICE_TOKEN }}
        run: node scripts/deploy.mjs secrets

      - name: Deploy the Worker
        working-directory: apps/web
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: pnpm exec wrangler deploy

      - name: Smoke-test /healthz
        env:
          TARGET: ${{ inputs.environment }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: node scripts/deploy.mjs smoke-test "$TARGET"
